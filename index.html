<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shu-Sheng Winery — Opening</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Mumu clay palette — warm, matte, chunky */
      --clay-cream: #f2e0c4;
      --clay-warm: #e8c99a;
      --clay-bg: #ede4d0;
      --clay-surface: #f5ead8;
      --clay-brown: #5a3820; /* deeper clay brown for borders/shadows */
      --clay-brown-light: #7b4f31;
      --clay-terracotta: #c4622d;
      --clay-orange: #e8943a;
      --clay-mustard: #d4a832;
      --clay-green: #5a7a48;
      --clay-green-dark: #4a6840;
      --clay-moss: #3d5c38;
      --clay-red: #c44b3a;
      --clay-purple: #7a5088;
      --text: #4a3020;
      --text-muted: #8b6e52;
      --font: "M PLUS Rounded 1c", sans-serif;
      --radius-chunky: 1.4vw;
      --radius-pill: 10vw;
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      
      /* Organic hand-molded clay border radii */
      --radius-chunky-1: 1.8vw 1.3vw 1.6vw 1.4vw / 1.3vw 1.6vw 1.4vw 1.8vw;
      --radius-chunky-2: 1.4vw 1.7vw 1.5vw 1.6vw / 1.7vw 1.5vw 1.6vw 1.4vw;
      --radius-circle-organic: 48% 52% 51% 49% / 52% 48% 52% 48%;

      /* Thick clay drop shadow and puffy inset lighting */
      --clay-shadow-puffy:
        0 0.6vw 0 var(--clay-brown),
        0 0.3vw 0.8vw rgba(74, 48, 32, 0.2),
        inset 0.2vw 0.2vw 0.4vw rgba(255, 255, 255, 0.65),
        inset -0.2vw -0.2vw 0.4vw rgba(74, 48, 32, 0.15);
      
      --clay-lift:
        0 0.7vw 0 var(--clay-brown),
        0 0.4vw 1vw rgba(74, 48, 32, 0.22),
        inset 0.2vw 0.2vw 0.4vw rgba(255, 255, 255, 0.7),
        inset -0.2vw -0.2vw 0.4vw rgba(74, 48, 32, 0.15);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #3a2818;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: var(--font);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── STAGE (16:9) ──────────────────────────────── */
    #stage {
      position: relative;
      width:  min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      overflow: hidden;
      background: var(--clay-bg);
    }

    /* ─── Background stack: clay image + paper texture ── */
    .bg-stack {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .layer-bg-main {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center 40%;
      transition: filter 0.7s ease, transform 8s ease;
    }

    .paper-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: url("https://www.transparenttextures.com/patterns/paper-fibers.png");
      background-size: 280px 280px;
      opacity: 0.52;
      mix-blend-mode: multiply;
    }
    .paper-overlay-grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      background-image: url("https://www.transparenttextures.com/patterns/cream-paper.png");
      background-size: 400px 400px;
      mix-blend-mode: multiply;
    }

    /* ─── Global Paper Textures ─── */
    .global-paper {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 99;
      opacity: 0.45;
      mix-blend-mode: multiply;
      background-image: url("https://www.transparenttextures.com/patterns/paper-fibers.png");
      background-size: 280px 280px;
    }
    .global-paper-grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 99;
      opacity: 0.18;
      mix-blend-mode: multiply;
      background-image: url("https://www.transparenttextures.com/patterns/cream-paper.png");
      background-size: 400px 400px;
    }

    /* Jitter animation for stop-motion handmade feel */
    @keyframes stop-motion-jitter {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(-0.06vw, 0.08vw) rotate(-0.6deg) scaleX(1.005); }
      50% { transform: translate(0.08vw, -0.06vw) rotate(0.6deg) scaleY(0.995); }
      75% { transform: translate(-0.08vw, -0.08vw) rotate(-0.4deg) scaleX(0.995); }
    }

    /* Warm vignette over background only */
    .bg-stack::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 90% 70% at 50% 50%, transparent 40%, rgba(74, 48, 32, 0.07) 100%),
        radial-gradient(ellipse 60% 50% at 50% 85%, rgba(232, 148, 58, 0.12) 0%, transparent 70%);
    }

    /* ─── CLAY WINERY BUILDING (generated asset) ──── */
    #building {
      position: absolute;
      bottom: 18%; right: 2%;
      width: 30%;
      height: auto;
      opacity: 0;
      transform: translateY(1.2vw) scale(0.88);
      transition: opacity 0.7s ease, transform 0.7s var(--ease-bounce);
      pointer-events: none;
      z-index: 8;
      filter: drop-shadow(0.8vw 1.1vw 0 var(--clay-brown));
    }
    #building.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      animation: stop-motion-jitter 2s steps(4) infinite;
    }

    /* ─── WINERY SIGN ─────────────────────────────── */
    #winery-sign {
      position: absolute;
      bottom: 33%; right: 23%;
      opacity: 0;
      transform: translateY(1vw) scale(0.92);
      transition: opacity 0.5s ease, transform 0.5s var(--ease-bounce);
      z-index: 9;
    }
    #winery-sign.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      animation: stop-motion-jitter 1.8s steps(4) infinite;
    }

    .sign-board {
      background: var(--clay-terracotta);
      border: 0.25vw solid var(--clay-brown);
      border-radius: var(--radius-chunky-1);
      color: #fff8f0;
      padding: 0.55vw 1.5vw;
      text-align: center;
      box-shadow: var(--clay-shadow-puffy);
    }
    .sign-cn {
      font-size: 1.3vw; font-weight: 800; letter-spacing: 0.15em;
    }
    .sign-en {
      font-size: 0.65vw; margin-top: 0.15vw; opacity: 0.85; font-weight: 600;
      letter-spacing: 0.08em;
    }
    .sign-post {
      width: 0.6vw; height: 4vw;
      background: var(--clay-brown);
      margin: -0.1vw auto 0;
      border-radius: 0.3vw 0.4vw 0.3vw 0.4vw / 1vw 1vw 1vw 1vw;
      box-shadow:
        0.3vw 0.3vw 0 rgba(74, 48, 32, 0.15),
        inset 0.1vw 0.1vw 0.2vw rgba(255, 255, 255, 0.2);
    }

    /* ─── RUNNER (Doris) ──────────────────────────── */
    #runner-wrap {
      position: absolute;
      bottom: 25%; left: -15%;
      height: 32%; width: auto;
      z-index: 10;
      will-change: left;
      transition: opacity 0.5s ease;
    }
    #runner-wrap img {
      height: 100%; width: auto;
      object-fit: contain;
      filter:
        contrast(1.06) brightness(1.04) saturate(0.92)
        drop-shadow(0.5vw 0.6vw 0 var(--clay-brown));
    }

    @keyframes run-bounce {
      0%   { transform: translateY(0)     scaleY(1.00) rotate(-2deg); }
      50%  { transform: translateY(-10px) scaleY(0.94) rotate(3deg);  }
      100% { transform: translateY(0)     scaleY(1.00) rotate(-2deg); }
    }
    @keyframes idle-bob {
      0%, 100% { transform: translateY(0)    rotate(0deg);   }
      50%       { transform: translateY(-4px) rotate(1deg); }
    }

    #runner-wrap.running { animation: run-bounce 0.42s ease-in-out infinite; }
    #runner-wrap.idle    { animation: idle-bob   1.6s ease-in-out infinite; }

    /* ─── DISCOVERY CARD (chunky clay) ────────────── */
    #discovery-card {
      position: absolute;
      top: 10%; left: 50%;
      transform: translateX(-50%) translateY(1vw) scale(0.88);
      opacity: 0;
      background: var(--clay-surface);
      border: 0.25vw solid var(--clay-brown);
      border-radius: var(--radius-chunky-2);
      padding: 1.3vw 2.8vw;
      text-align: center;
      box-shadow: var(--clay-lift);
      min-width: 22vw;
      transition: opacity 0.45s ease, transform 0.45s var(--ease-bounce);
      z-index: 20;
    }
    #discovery-card.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
      animation: stop-motion-jitter 2.2s steps(4) infinite;
    }
    .card-icon-wrap {
      width: 4.5vw; height: 4.5vw;
      background: var(--clay-cream);
      border: 0.2vw solid var(--clay-brown);
      border-radius: var(--radius-circle-organic);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 0.4vw;
      box-shadow:
        0 0.3vw 0 var(--clay-brown),
        inset 0.15vw 0.15vw 0.3vw rgba(255,255,255,0.6);
    }
    .card-icon  { font-size: 2.5vw; line-height: 1; }
    .card-title {
      font-size: 1.4vw; color: var(--clay-terracotta); font-weight: 900; margin-top: 0.4vw;
    }
    .card-sub {
      font-size: 0.8vw; color: var(--text-muted); margin-top: 0.3vw; font-weight: 700;
    }

    /* ─── ICONS LAYER (clay emoji stamps) ─────────── */
    #icons-layer {
      position: absolute;
      top: 12%; left: 28%; right: 8%; bottom: 40%;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 15; pointer-events: none;
    }
    #icons-layer.visible { opacity: 1; }

    .icon-item {
      position: absolute;
      opacity: 0;
      width: 6.5vw; height: 6.5vw;
      background: var(--clay-surface) url("assets/clay-icons-sheet.png") no-repeat;
      background-size: 200% 200%;
      border: 0.25vw solid var(--clay-brown);
      border-radius: var(--radius-circle-organic);
      box-shadow:
        0 0.5vw 0 var(--clay-brown),
        0 0.2vw 0.6vw rgba(74, 48, 32, 0.15),
        inset 0.15vw 0.15vw 0.3vw rgba(255,255,255,0.6);
    }
    #ic-grape { background-position: 0% 0%; }
    #ic-wine  { background-position: 100% 0%; }
    #ic-note  { background-position: 0% 100%; }
    #ic-map   { background-position: 100% 100%; }

    @keyframes icon-stamp {
      0%   { opacity: 0; transform: scale(0.3) rotate(-15deg); }
      60%  { opacity: 1; transform: scale(1.15) rotate(4deg);   }
      100% { opacity: 1; transform: scale(1)   rotate(0deg);   }
    }
    .icon-item.pop { animation: icon-stamp 0.45s var(--ease-bounce) forwards; }

    /* ─── SHU-SHENG SPOTLIGHT (Scene 5) ───────────── */
    #shu-sheng-spotlight {
      position: absolute;
      inset: 0;
      z-index: 25;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s ease;
    }
    #shu-sheng-spotlight.visible { opacity: 1; }

    .spotlight-vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 70% at 35% 50%, rgba(232, 148, 58, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse 80% 90% at 38% 50%,
          rgba(242, 224, 196, 0.1) 0%,
          rgba(237, 228, 208, 0.8) 55%,
          rgba(232, 212, 180, 0.95) 100%);
    }

    /* Clay winery backdrop — AI generated */
    .spotlight-winery-bg {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .shu-sheng-stage-wrap {
      position: absolute;
      left: 3%; top: 50%;
      transform: translateY(-50%) scale(0.82);
      width: 54%; height: 72%;
      opacity: 0;
      transition: opacity 0.6s ease, transform 0.8s var(--ease-bounce);
    }
    .shu-sheng-stage-wrap.visible {
      opacity: 1;
      transform: translateY(-50%) scale(1);
    }

    .shu-sheng-stage {
      position: relative;
      width: 100%; height: 100%;
      background: var(--clay-surface);
      border: 0.4vw solid var(--clay-brown);
      border-radius: var(--radius-chunky-2);
      box-shadow:
        0 0.8vw 0 var(--clay-brown),
        0 0.4vw 1.2vw rgba(74, 48, 32, 0.2),
        inset 0.3vw 0.3vw 0.6vw rgba(255, 255, 255, 0.6);
      overflow: hidden;
    }

    /* Thick clay frame lip */
    .shu-sheng-stage::before {
      content: '';
      position: absolute;
      inset: 0.5vw;
      border-radius: calc(var(--radius-chunky) * 0.7);
      box-shadow: inset 0 0.5vw 1.4vw rgba(74, 48, 32, 0.15);
      pointer-events: none;
      z-index: 2;
    }
    .shu-sheng-stage::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top right, transparent 40%, rgba(255, 255, 255, 0.12));
      pointer-events: none;
      z-index: 3;
    }

    .shu-sheng-photo-wrap {
      position: absolute;
      inset: 0.5vw;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: calc(var(--radius-chunky) * 0.6);
    }

    .shu-sheng-photo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      filter: contrast(1.04) brightness(1.03) saturate(0.9) sepia(0.06);
      border-radius: calc(var(--radius-chunky) * 0.5);
    }

    .shu-sheng-name-tag {
      position: absolute;
      bottom: 1.2vw; left: 50%;
      transform: translateX(-50%) translateY(0.5vw);
      opacity: 0;
      background: var(--clay-terracotta);
      border: 0.25vw solid var(--clay-brown);
      border-radius: var(--radius-chunky-1);
      color: #fff8f0;
      padding: 0.55vw 2.2vw;
      font-size: 1.5vw;
      font-weight: 900;
      letter-spacing: 0.18em;
      box-shadow: var(--clay-shadow-puffy);
      z-index: 5;
      transition: opacity 0.5s ease 0.4s, transform 0.5s var(--ease-bounce) 0.4s;
    }
    .shu-sheng-name-tag.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      animation: stop-motion-jitter 1.5s steps(4) infinite;
    }
    .shu-sheng-name-tag span {
      color: var(--clay-mustard);
      font-size: 0.7vw;
      display: block;
      letter-spacing: 0.35em;
      margin-bottom: 0.15vw;
      font-weight: 800;
    }

    /* ─── KEYWORDS (Scene 5) — original pill card style ── */
    #keywords-layer {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      justify-content: center; align-items: flex-end;
      padding-right: 6%; gap: 1.4vw;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 30;
    }
    #keywords-layer.visible { opacity: 1; }

    .kw-row {
      display: flex; align-items: center; gap: 1vw;
      opacity: 0; transform: translateX(3vw) scale(0.92);
      background: var(--clay-cream);
      border: 0.22vw solid var(--clay-brown);
      border-radius: var(--radius-pill);
      padding: 0.5vw 1.6vw 0.5vw 0.75vw;
      box-shadow: var(--clay-lift);
      transition: opacity 0.45s ease, transform 0.45s var(--ease-bounce);
    }
    .kw-row.visible {
      opacity: 1;
      transform: translateX(0) scale(1);
      animation: stop-motion-jitter 2s steps(4) infinite;
    }

    .kw-check {
      width: 2.2vw; height: 2.2vw;
      background: var(--clay-moss);
      border: 0.2vw solid var(--clay-brown);
      border-radius: var(--radius-circle-organic);
      display: flex; align-items: center; justify-content: center;
      color: #f0f8e8; font-size: 1.1vw; flex-shrink: 0;
      box-shadow:
        0 0.25vw 0 var(--clay-brown),
        inset 0.1vw 0.1vw 0.2vw rgba(255, 255, 255, 0.5);
      font-weight: 900;
    }
    .kw-label {
      font-size: 2.5vw; font-weight: 900;
      color: var(--text);
    }

    /* ─── SCENE TEXT ──────────────────────────────── */
    #scene-text {
      position: absolute;
      bottom: 5.5%; left: 50%;
      transform: translateX(-50%) translateY(0.5vw);
      text-align: center;
      font-size: 1.5vw; font-weight: 800;
      color: var(--text);
      opacity: 0;
      transition: opacity 0.45s ease, transform 0.45s var(--ease-bounce);
      z-index: 35; pointer-events: none;
      background: var(--clay-surface);
      border: 0.25vw solid var(--clay-brown);
      border-radius: var(--radius-chunky-1);
      padding: 0.65vw 2.2vw;
      box-shadow: var(--clay-lift);
      white-space: nowrap;
    }
    #scene-text.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      animation: stop-motion-jitter 2.5s steps(4) infinite;
    }

    /* ─── FOLD OVERLAY ────────────────────────────── */
    #fold-overlay {
      position: absolute; inset: 0;
      z-index: 48; pointer-events: none;
      display: none;
    }
    #fold-overlay.active { display: block; }

    #fold-top, #fold-bottom {
      position: absolute;
      left: 0; right: 0; height: 50%;
      transition: transform 0.88s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #fold-top {
      top: 0;
      transform-origin: center top;
      transform: perspective(2000px) rotateX(0deg);
      background: linear-gradient(180deg, var(--clay-surface) 0%, var(--clay-warm) 100%);
      box-shadow: inset 0 -3px 0 rgba(74, 48, 32, 0.1);
    }
    #fold-top::after {
      content: '🍷';
      position: absolute;
      bottom: 20%; left: 50%;
      transform: translateX(-50%);
      font-size: 2.5vw; opacity: 0.15;
    }
    #fold-bottom {
      bottom: 0;
      transform-origin: center bottom;
      transform: perspective(2000px) rotateX(0deg);
      background: linear-gradient(180deg, var(--clay-warm) 0%, #c8a878 100%);
      box-shadow: inset 0 3px 0 rgba(74, 48, 32, 0.1);
    }
    #fold-bottom::after {
      content: '🍇';
      position: absolute;
      top: 20%; left: 50%;
      transform: translateX(-50%);
      font-size: 2.5vw; opacity: 0.15;
    }

    #fold-top.fold    { transform: perspective(2000px) rotateX(-105deg); }
    #fold-bottom.fold { transform: perspective(2000px) rotateX(105deg);  }

    /* ─── FINAL SCENE — warm clay room tone ───────── */
    #final-scene {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, #5a3820 0%, var(--clay-brown) 45%, #4a2e18 100%);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.6s ease;
      z-index: 50;
    }
    #final-scene::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 50% at 50% 80%, rgba(232, 148, 58, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    #final-scene.visible { opacity: 1; pointer-events: all; }

    .final-eyebrow {
      font-size: 0.75vw; color: var(--clay-mustard);
      letter-spacing: 0.4em; text-transform: uppercase;
      margin-bottom: 1.5vw; font-weight: 900;
    }
    .final-title {
      font-size: 2.8vw; color: var(--clay-cream);
      font-weight: 900; text-align: center;
      line-height: 1.3; margin-bottom: 0.9vw; max-width: 72%;
    }
    .final-subtitle {
      font-size: 1.15vw; color: var(--clay-warm);
      text-align: center;
      margin-bottom: 3vw; font-weight: 700;
    }
    .btn-start {
      padding: 0.8vw 3.2vw;
      background: var(--clay-mustard);
      border: 0.25vw solid var(--clay-brown);
      border-radius: var(--radius-pill);
      font-family: var(--font);
      font-size: 1.1vw; font-weight: 900; letter-spacing: 0.05em;
      color: var(--text);
      cursor: pointer;
      box-shadow:
        0 0.5vw 0 var(--clay-brown),
        inset 0.18vw 0.18vw 0.3vw rgba(255, 255, 255, 0.5);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn-start:hover {
      transform: translateY(-0.1vw);
      box-shadow:
        0 0.6vw 0 var(--clay-brown),
        inset 0.18vw 0.18vw 0.3vw rgba(255, 255, 255, 0.5);
    }
    .btn-start:active {
      transform: translateY(0.3vw);
      box-shadow:
        0 0.2vw 0 var(--clay-brown),
        inset 0.1vw 0.1vw 0.2vw rgba(255, 255, 255, 0.3);
    }

    .final-deco {
      position: absolute; bottom: 4%;
      font-size: 1.2vw; letter-spacing: 0.5em;
      opacity: 0.2; color: var(--clay-mustard);
    }

    /* ─── PROGRESS DOTS ───────────────────────────── */
    #progress {
      position: absolute;
      bottom: 1.5%; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 0.5vw; z-index: 60;
    }
    .pdot {
      width: 0.9vw; height: 0.9vw;
      background: var(--clay-cream);
      border: 0.15vw solid var(--clay-brown);
      border-radius: var(--radius-circle-organic);
      box-shadow:
        0 0.15vw 0 var(--clay-brown),
        inset 0.05vw 0.05vw 0.1vw rgba(255,255,255,0.4);
      transition: background 0.35s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }
    .pdot.active {
      background: var(--clay-orange);
      transform: scale(1.3);
      box-shadow:
        0 0.25vw 0 var(--clay-brown),
        inset 0.08vw 0.08vw 0.15vw rgba(255,255,255,0.5);
    }

    /* Dim main scene during spotlight */
    #stage.spotlight-mode .bg-stack,
    #stage.spotlight-mode #building,
    #stage.spotlight-mode #winery-sign {
      filter: blur(4px) brightness(0.6) saturate(0.85);
      transition: filter 0.7s ease;
    }

    /* Paper texture on spotlight bg too */
    #shu-sheng-spotlight .paper-overlay {
      z-index: 2;
      opacity: 0.38;
    }
  </style>
</head>
<body>
<div id="stage">

  <div class="bg-stack">
    <img class="layer-bg-main" src="assets/bg-main-scene.png" alt="">
    <div class="paper-overlay"></div>
    <div class="paper-overlay-grain"></div>
  </div>

  <!-- AI-generated clay winery building -->
  <img id="building" src="assets/clay-winery-building.png" alt="樹生酒莊">

  <div id="winery-sign">
    <div class="sign-board">
      <div class="sign-cn">樹生酒莊</div>
      <div class="sign-en">Shu-Sheng Winery</div>
    </div>
    <div class="sign-post"></div>
  </div>

  <div id="discovery-card">
    <div class="card-icon-wrap">
      <div class="card-icon">🥇</div>
    </div>
    <div class="card-title">Gold Medal Wines</div>
    <div class="card-sub">International Award Winner</div>
  </div>

  <div id="icons-layer">
    <div class="icon-item" id="ic-grape" style="top:8%;  left:6%;"></div>
    <div class="icon-item" id="ic-wine"  style="top:18%; left:46%;"></div>
    <div class="icon-item" id="ic-note"  style="top:2%;  left:74%;"></div>
    <div class="icon-item" id="ic-map"   style="top:52%; left:22%;"></div>
  </div>

  <!-- ── Shu-Sheng Spotlight (Scene 5) ─────────────── -->
  <div id="shu-sheng-spotlight">
    <div class="spotlight-vignette"></div>

    <img class="spotlight-winery-bg" src="assets/bg-spotlight-winery.png" alt="">
    <div class="paper-overlay"></div>

    <div class="shu-sheng-stage-wrap" id="shu-sheng-stage-wrap">
      <div class="shu-sheng-stage">
        <div class="shu-sheng-photo-wrap">
          <img src="assets/shu-sheng-photo.png" alt="樹生 — Shu Sheng" class="shu-sheng-photo">
        </div>
        <div class="shu-sheng-name-tag" id="shu-sheng-name-tag">
          <span>FOUNDER</span>
          樹生
        </div>
      </div>
    </div>
  </div>

  <!-- Keywords: Create / Capture / Sustain -->
  <div id="keywords-layer">
    <div class="kw-row" id="kw-creation">
      <div class="kw-check">✓</div>
      <div class="kw-label">Create</div>
    </div>
    <div class="kw-row" id="kw-capture">
      <div class="kw-check">✓</div>
      <div class="kw-label">Capture</div>
    </div>
    <div class="kw-row" id="kw-sustain">
      <div class="kw-check">✓</div>
      <div class="kw-label">Sustain</div>
    </div>
  </div>

  <div id="runner-wrap">
    <img src="runner.png" alt="Doris running in Waipu"
         onerror="this.style.display='none';this.parentElement.innerHTML='<div style=\'font-size:8vw;filter:drop-shadow(0.3vw 0.5vw 0.3vw rgba(45,52,54,0.15))\'>🏃‍♀️</div>'">
  </div>

  <div id="scene-text"></div>

  <div id="fold-overlay">
    <div id="fold-top"></div>
    <div id="fold-bottom"></div>
  </div>

  <div id="final-scene">
    <div class="final-eyebrow">✦ Waipu Wine Cluster · Group 7 ✦</div>
    <div class="final-title">Why Shu-Sheng Winery Matters</div>
    <div class="final-subtitle">A local survival model of Waipu's wine industry</div>
    <button class="btn-start" id="btn-start">Start Presentation →</button>
    <div class="final-deco">🍇 🍷 🍇 🍷 🍇 🍷 🍇</div>
  </div>

  <div id="progress">
    <div class="pdot" id="d0"></div>
    <div class="pdot" id="d1"></div>
    <div class="pdot" id="d2"></div>
    <div class="pdot" id="d3"></div>
    <div class="pdot" id="d4"></div>
    <div class="pdot" id="d5"></div>
  </div>

  <!-- Global paper texture overlays to bind photos and 3D scenes -->
  <div class="global-paper"></div>
  <div class="global-paper-grain"></div>

</div>

<script>
  const TEXTS = {
    1: 'She grew up in Waipu.',
    2: 'A familiar place, yet often overlooked.',
    3: 'Then we discovered: gold-medal wines.',
    4: 'But the real insight came after the interview.',
    5: 'Three keys to its survival.',
  };

  const TIMELINE = [
    [1,   400],
    [2,  5800],
    [3, 11500],
    [4, 17000],
    [5, 22500],
    [6, 29000],
  ];

  const $ = id => document.getElementById(id);
  const stage     = $('stage');
  const runner    = $('runner-wrap');
  const sceneText = $('scene-text');
  const sign      = $('winery-sign');
  const building  = $('building');
  const card      = $('discovery-card');
  const icons     = $('icons-layer');
  const kwLayer   = $('keywords-layer');
  const spotlight = $('shu-sheng-spotlight');
  const shuStage  = $('shu-sheng-stage-wrap');
  const shuName   = $('shu-sheng-name-tag');
  const finalScene = $('final-scene');
  const foldOverlay = $('fold-overlay');
  const foldTop   = $('fold-top');
  const foldBot   = $('fold-bottom');
  const progress  = $('progress');
  const dots      = [0,1,2,3,4,5].map(i => $('d'+i));

  function dot(n) { dots.forEach((d,i) => d.classList.toggle('active', i === n)); }

  function showText(msg, delay = 900) {
    sceneText.classList.remove('visible');
    setTimeout(() => { sceneText.textContent = msg; sceneText.classList.add('visible'); }, delay);
  }
  function hideText() { sceneText.classList.remove('visible'); }

  function moveRunner(leftPct, ms = 2200, stepsN = 6) {
    runner.style.transition = `left ${ms}ms cubic-bezier(0.4, 0, 0.2, 1)`;
    runner.style.left = leftPct + '%';
  }

  function origamiFold(callback) {
    foldOverlay.classList.add('active');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        foldTop.classList.add('fold');
        foldBot.classList.add('fold');
      });
    });
    setTimeout(() => {
      foldOverlay.classList.remove('active');
      foldTop.classList.remove('fold');
      foldBot.classList.remove('fold');
      callback();
    }, 980);
  }

  const SCENES = {
    1() {
      dot(0);
      runner.classList.add('running');
      runner.classList.remove('idle');
      moveRunner(22, 3400);
      /* subtle Ken Burns on clay background */
      const bg = document.querySelector('.layer-bg-main');
      if (bg) { bg.style.transform = 'scale(1.04) translateX(-1%)'; }
      showText(TEXTS[1]);
    },
    2() {
      dot(1);
      hideText();
      moveRunner(44, 2800);
      const bg = document.querySelector('.layer-bg-main');
      if (bg) { bg.style.transform = 'scale(1.07) translateX(-2.5%)'; }
      setTimeout(() => {
        sign.classList.add('visible');
        building.classList.add('visible');
        showText(TEXTS[2], 700);
      }, 600);
    },
    3() {
      dot(2);
      hideText();
      runner.classList.remove('running');
      runner.classList.add('idle');
      moveRunner(32, 600);
      setTimeout(() => {
        card.classList.add('visible');
        showText(TEXTS[3], 700);
      }, 700);
    },
    4() {
      dot(3);
      hideText();
      card.classList.remove('visible');
      runner.classList.add('running');
      runner.classList.remove('idle');
      moveRunner(53, 1800);
      setTimeout(() => {
        icons.classList.add('visible');
        ['ic-grape','ic-wine','ic-note','ic-map'].forEach((id, i) => {
          setTimeout(() => $(id).classList.add('pop'), i * 340);
        });
        showText(TEXTS[4], 500);
      }, 900);
    },
    5() {
      dot(4);
      hideText();
      icons.classList.remove('visible');

      /* Fade out runner, dim background */
      runner.style.transition = 'opacity 0.6s ease, left 0.5s ease';
      runner.style.opacity = '0';
      stage.classList.add('spotlight-mode');

      /* Reveal Shu-Sheng spotlight with winery backdrop */
      spotlight.classList.add('visible');
      setTimeout(() => shuStage.classList.add('visible'), 300);
      setTimeout(() => shuName.classList.add('visible'), 800);

      /* Stagger keywords: Create → Capture → Sustain */
      kwLayer.classList.add('visible');
      ['kw-creation','kw-capture','kw-sustain'].forEach((id, i) => {
        setTimeout(() => $(id).classList.add('visible'), 1200 + i * 900);
      });
      showText(TEXTS[5], 600);
    },
    6() {
      dot(5);
      hideText();
      spotlight.classList.remove('visible');
      shuStage.classList.remove('visible');
      shuName.classList.remove('visible');
      kwLayer.classList.remove('visible');
      ['kw-creation','kw-capture','kw-sustain'].forEach(id => $(id).classList.remove('visible'));
      stage.classList.remove('spotlight-mode');

      progress.style.transition = 'opacity 0.3s ease';
      progress.style.opacity = '0';

      setTimeout(() => {
        origamiFold(() => finalScene.classList.add('visible'));
      }, 400);
    },
  };

  window.addEventListener('load', () => {
    runner.style.transition = 'none';
    runner.style.left = '-14%';
    runner.style.opacity = '1';
    TIMELINE.forEach(([scene, delay]) => setTimeout(() => SCENES[scene](), delay));
  });

  $('btn-start').addEventListener('click', () => {
    alert('Presentation starting!\n(Wire this to your slide navigation.)');
  });
</script>
</body>
</html>
